[build]
  publish = "dist"
  command = "npm run build"

[dev]
  targetPort = 5173
  framework = "vite"

# Edge functions
[[edge_functions]]
  function = "tiles"
  path = "/tiles/:type/:z/:x/:y"

# Headers for caching and security
[[headers]]
  for = "/tiles/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
